<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Out of bounds · Referee For Fun</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0b0b">
<link rel="icon" type="image/png" href="/img/app-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Barlow:wght@400;600&family=Cormorant+SC:wght@600&display=swap">
<style>
/* Design: DESIGN.md in the repo root, same tokens as index.html */
:root{--ink:#0b0b0b;--text:#ececec;--soft:#b9b9b9;--gold:#d9b45a;--red:#d63c36;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--ink) url(/img/venue-badminton-hall.jpg) center/cover;color:var(--text);font:400 18px/1.6 Barlow,"Helvetica Neue",Arial,sans-serif;padding:16px}
body::before{content:"";position:fixed;inset:0;background:rgba(11,11,11,.82)}
main{position:relative;max-width:560px;text-align:center}
.flag{display:inline-block;font:600 18px/1 "Cormorant SC",Georgia,serif;letter-spacing:.08em;color:var(--gold)}
h1{margin:14px 0 12px;font:700 clamp(56px,14vw,104px)/.9 "Barlow Condensed","Arial Narrow",sans-serif;text-transform:uppercase;color:#fff;transform:skewX(-6deg);text-wrap:balance}
h1 span{color:var(--red)}
p{margin:0 0 28px;color:var(--soft)}
.btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
a.btn{display:inline-flex;align-items:center;min-height:48px;padding:0 24px;border:2px solid #fff;color:#fff;text-decoration:none;font:700 18px/1 "Barlow Condensed",sans-serif;letter-spacing:.06em;text-transform:uppercase;transition:background .2s,color .2s}
a.btn.solid{background:#fff;color:#0b0b0b}
a.btn:hover{background:var(--gold);border-color:var(--gold);color:#0b0b0b}
a.btn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
a.btn{touch-action:manipulation}
@media (prefers-reduced-motion:reduce){a.btn{transition:none}}
</style>
</head>
<body>
<main>
  <p class="flag">Line judge's flag is up</p>
  <h1>That one is <span>out</span></h1>
  <p>There is no page at this address. The shuttle landed somewhere the court does not reach.</p>
  <div class="btns">
    <a class="btn solid" href="/">Back to the court</a>
    <a class="btn" href="/#download">Download the game</a>
  </div>
</main>
</body>
</html>
